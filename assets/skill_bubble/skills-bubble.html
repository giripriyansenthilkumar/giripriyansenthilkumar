<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Skills — Giripriyan S</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #07071a; }
  canvas { display: block; width: 100%; height: 100vh; }
  #tip {
    position: fixed;
    background: rgba(10,10,30,0.88);
    color: #fff;
    font-family: 'Fira Code', monospace;
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 20px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.18s;
    white-space: nowrap;
    border: 1px solid rgba(255,255,255,0.14);
    z-index: 99;
  }
  #heading {
    position: fixed;
    top: 18px;
    left: 0; right: 0;
    text-align: center;
    font-family: 'Fira Code', monospace;
    color: rgba(255,255,255,0.55);
    font-size: 12px;
    letter-spacing: 0.12em;
    pointer-events: none;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="tip"></div>
<div id="heading">⚔️ Skills · Drag &amp; float</div>
<script>
const skills = [
  { name: "Python",       cat: "lang",    r: 54 },
  { name: "C++",          cat: "lang",    r: 34 },
  { name: "HTML5",        cat: "lang",    r: 28 },
  { name: "CSS3",         cat: "lang",    r: 28 },
  { name: "MySQL",        cat: "lang",    r: 30 },
  { name: "PyTorch",      cat: "ai",      r: 48 },
  { name: "TensorFlow",   cat: "ai",      r: 48 },
  { name: "scikit-learn", cat: "ai",      r: 38 },
  { name: "Transformers", cat: "ai",      r: 42 },
  { name: "LLMs",         cat: "ai",      r: 40 },
  { name: "RAG",          cat: "ai",      r: 36 },
  { name: "Embeddings",   cat: "ai",      r: 34 },
  { name: "Whisper",      cat: "ai",      r: 34 },
  { name: "OpenCV",       cat: "cv",      r: 38 },
  { name: "YOLO",         cat: "cv",      r: 32 },
  { name: "EasyOCR",      cat: "cv",      r: 30 },
  { name: "Flask",        cat: "backend", r: 40 },
  { name: "Django",       cat: "backend", r: 34 },
  { name: "MongoDB",      cat: "backend", r: 36 },
  { name: "Git",          cat: "tools",   r: 30 },
  { name: "GitHub",       cat: "tools",   r: 32 },
  { name: "VS Code",      cat: "tools",   r: 28 },
  { name: "Anaconda",     cat: "tools",   r: 28 },
  { name: "Colab",        cat: "tools",   r: 28 },
];

const palette = {
  lang:    { fill: "rgba(99,102,241,0.84)",  stroke: "#818cf8", glow: "#6366f1", label: "#e0e7ff" },
  ai:      { fill: "rgba(139,92,246,0.84)",  stroke: "#c084fc", glow: "#a855f7", label: "#f3e8ff" },
  cv:      { fill: "rgba(6,182,212,0.84)",   stroke: "#22d3ee", glow: "#06b6d4", label: "#cffafe" },
  backend: { fill: "rgba(16,185,129,0.84)",  stroke: "#34d399", glow: "#10b981", label: "#d1fae5" },
  tools:   { fill: "rgba(245,158,11,0.84)",  stroke: "#fbbf24", glow: "#f59e0b", label: "#fef3c7" },
};

const catLabel = {
  lang: "Languages", ai: "AI / ML", cv: "Computer Vision",
  backend: "Backend & DB", tools: "Tools & Platforms"
};

const canvas = document.getElementById("canvas");
const tip    = document.getElementById("tip");
const ctx    = canvas.getContext("2d");
let W, H, bubbles = [];
let dragIdx = -1, dragOffX = 0, dragOffY = 0, isDragging = false;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function init() {
  resize();
  bubbles = skills.map(s => ({
    ...s,
    x: s.r + Math.random() * (W - s.r * 2),
    y: s.r + Math.random() * (H - s.r * 2),
    vx: (Math.random() - 0.5) * 0.6,
    vy: (Math.random() - 0.5) * 0.6,
    floatOffset: Math.random() * Math.PI * 2,
    floatSpeed:  0.007 + Math.random() * 0.005,
    pulse: 0,
    hovered: false,
  }));
  for (let i = 0; i < 120; i++) separate();
}

function separate() {
  for (let i = 0; i < bubbles.length; i++) {
    for (let j = i + 1; j < bubbles.length; j++) {
      const a = bubbles[i], b = bubbles[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx*dx + dy*dy) || 0.001;
      const gap = a.r + b.r + 5;
      if (d < gap) {
        const push = (gap - d) / d * 0.52;
        a.x -= dx * push; a.y -= dy * push;
        b.x += dx * push; b.y += dy * push;
      }
    }
    clamp(bubbles[i]);
  }
}

function clamp(b) {
  b.x = Math.max(b.r, Math.min(W - b.r, b.x));
  b.y = Math.max(b.r, Math.min(H - b.r, b.y));
}

function hitTest(x, y, t) {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    const fy = Math.sin((t || 0) * b.floatSpeed + b.floatOffset) * 3.5;
    const dx = x - b.x, dy = y - (b.y + fy);
    if (Math.sqrt(dx*dx + dy*dy) <= b.r * 1.12) return i;
  }
  return -1;
}

function drawBubble(b, t) {
  const col = palette[b.cat];
  const fy  = Math.sin(t * b.floatSpeed + b.floatOffset) * 3.5;
  const px  = b.x, py = b.y + fy;
  const scale = b.hovered ? 1.09 : 1;
  const rr  = b.r * scale;

  ctx.save();
  ctx.translate(px, py);

  /* glow */
  if (b.hovered || b.pulse > 0) {
    const a = b.hovered ? 0.4 : b.pulse * 0.3;
    const gr = ctx.createRadialGradient(0,0,rr*0.4,0,0,rr*1.8);
    gr.addColorStop(0, col.glow + "66");
    gr.addColorStop(1, "transparent");
    ctx.beginPath(); ctx.arc(0,0,rr*1.8,0,Math.PI*2);
    ctx.fillStyle = gr; ctx.fill();
    if (b.pulse > 0) b.pulse = Math.max(0, b.pulse - 0.025);
  }

  /* fill */
  const bg = ctx.createRadialGradient(-rr*.3,-rr*.3,rr*.05,0,0,rr);
  bg.addColorStop(0, col.fill.replace("0.84","0.96"));
  bg.addColorStop(1, col.fill.replace("0.84","0.62"));
  ctx.beginPath(); ctx.arc(0,0,rr,0,Math.PI*2);
  ctx.fillStyle = bg; ctx.fill();

  /* border */
  ctx.lineWidth   = b.hovered ? 2.5 : 1.2;
  ctx.strokeStyle = col.stroke;
  ctx.stroke();

  /* specular shine */
  const sh = ctx.createRadialGradient(-rr*.34,-rr*.34,0,-rr*.2,-rr*.2,rr*.55);
  sh.addColorStop(0,"rgba(255,255,255,0.28)");
  sh.addColorStop(1,"rgba(255,255,255,0)");
  ctx.beginPath(); ctx.arc(0,0,rr,0,Math.PI*2);
  ctx.fillStyle = sh; ctx.fill();

  /* label */
  const fs = rr > 42 ? 13 : rr > 30 ? 11 : 10;
  ctx.font = `600 ${fs}px 'Fira Code', monospace`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if (ctx.measureText(b.name).width > rr * 1.7) ctx.font = `600 ${fs-1}px 'Fira Code', monospace`;
  ctx.shadowColor = "rgba(0,0,0,0.7)"; ctx.shadowBlur = 4;
  ctx.fillStyle = col.label;
  ctx.fillText(b.name, 0, 0);
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawLegend(t) {
  const cats = Object.keys(catLabel);
  const padding = 14, dotR = 5, gap = 8, textW = 110;
  const itemW = dotR*2 + gap + textW;
  const totalW = cats.length * itemW - gap + padding*2;
  let lx = (W - totalW) / 2 + padding;
  const ly = H - 18;

  cats.forEach(k => {
    const col = palette[k];
    ctx.beginPath(); ctx.arc(lx + dotR, ly, dotR, 0, Math.PI*2);
    ctx.fillStyle   = col.fill; ctx.fill();
    ctx.strokeStyle = col.stroke; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle   = "rgba(255,255,255,0.6)";
    ctx.font        = "10px 'Fira Code', monospace";
    ctx.textAlign   = "left"; ctx.textBaseline = "middle";
    ctx.fillText(catLabel[k], lx + dotR*2 + gap, ly);
    lx += itemW;
  });
}

let lastT = 0;
function loop(t) {
  ctx.clearRect(0, 0, W, H);

  /* physics */
  for (let i = 0; i < bubbles.length; i++) {
    if (i === dragIdx) continue;
    const a = bubbles[i];
    for (let j = i+1; j < bubbles.length; j++) {
      if (j === dragIdx) continue;
      const b = bubbles[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d  = Math.sqrt(dx*dx+dy*dy) || 0.001;
      const md = a.r + b.r + 4;
      if (d < md) {
        const f = (md-d)/d * 0.055;
        a.vx -= dx/d*f; a.vy -= dy/d*f;
        b.vx += dx/d*f; b.vy += dy/d*f;
      }
    }
    a.vx *= 0.979; a.vy *= 0.979;
    a.x  += a.vx;  a.y  += a.vy;
    if (a.x - a.r < 0)    { a.x = a.r;    a.vx =  Math.abs(a.vx)*0.55; }
    if (a.x + a.r > W)    { a.x = W-a.r;  a.vx = -Math.abs(a.vx)*0.55; }
    if (a.y - a.r < 0)    { a.y = a.r;    a.vy =  Math.abs(a.vy)*0.55; }
    if (a.y + a.r > H)    { a.y = H-a.r;  a.vy = -Math.abs(a.vy)*0.55; }
  }

  bubbles.forEach(b => drawBubble(b, t));
  drawLegend(t);
  lastT = t;
  requestAnimationFrame(loop);
}

/* ── pointer events ── */
function getXY(e) {
  if (e.touches && e.touches.length) {
    const r = canvas.getBoundingClientRect();
    return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top };
  }
  return { x: e.offsetX, y: e.offsetY };
}

canvas.addEventListener("mousedown", e => {
  const {x, y} = getXY(e);
  dragIdx = hitTest(x, y, lastT);
  if (dragIdx >= 0) {
    const b = bubbles[dragIdx];
    dragOffX = x - b.x; dragOffY = y - b.y;
    b.vx = 0; b.vy = 0; b.pulse = 1;
    isDragging = true; canvas.style.cursor = "grabbing";
  }
});
canvas.addEventListener("mousemove", e => {
  const {x, y} = getXY(e);
  if (isDragging && dragIdx >= 0) {
    const b = bubbles[dragIdx];
    const nx = x - dragOffX, ny = y - dragOffY;
    b.vx = (nx - b.x) * 0.4; b.vy = (ny - b.y) * 0.4;
    b.x  = nx; b.y = ny; clamp(b);
    tip.style.opacity = "0";
    return;
  }
  const idx = hitTest(x, y, lastT);
  bubbles.forEach((b, i) => b.hovered = i === idx);
  if (idx >= 0) {
    tip.textContent = catLabel[bubbles[idx].cat];
    tip.style.left  = (e.clientX + 14) + "px";
    tip.style.top   = (e.clientY - 26) + "px";
    tip.style.opacity = "1";
    canvas.style.cursor = "grab";
  } else {
    tip.style.opacity = "0";
    canvas.style.cursor = "default";
  }
});
canvas.addEventListener("mouseup",    () => { isDragging = false; dragIdx = -1; canvas.style.cursor = "default"; });
canvas.addEventListener("mouseleave", () => { isDragging = false; dragIdx = -1; tip.style.opacity = "0"; bubbles.forEach(b => b.hovered = false); });

canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  const {x, y} = getXY(e);
  dragIdx = hitTest(x, y, lastT);
  if (dragIdx >= 0) {
    const b = bubbles[dragIdx];
    dragOffX = x - b.x; dragOffY = y - b.y;
    b.vx = 0; b.vy = 0; b.pulse = 1; isDragging = true;
  }
}, { passive: false });

canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  if (!isDragging || dragIdx < 0) return;
  const {x, y} = getXY(e);
  const b = bubbles[dragIdx];
  const nx = x - dragOffX, ny = y - dragOffY;
  b.vx = (nx - b.x) * 0.4; b.vy = (ny - b.y) * 0.4;
  b.x  = nx; b.y = ny; clamp(b);
}, { passive: false });

canvas.addEventListener("touchend", () => { isDragging = false; dragIdx = -1; });

window.addEventListener("resize", () => { resize(); separate(); });

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
